services:
  db:
    image: andresveas/mariadb-owlaudit:latest
    container_name: db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: owl_auditv1
      MARIADB_USER: user
      MARIADB_PASSWORD: 12345
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net

  app:
    image: andresveas/owl-audit-app:latest
    container_name: webapp
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=owl_auditv1
      - DB_USER=user
      - DB_PASSWORD=12345
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
