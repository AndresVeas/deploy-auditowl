services:
  # Servicio de Base de Datos
  db:
    build: ./db
    image: andresveas/mariadb-owlaudit:latest
    container_name: app-mariadb
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servicio Web (Tomcat con el WAR dentro)
  app:
    image: andresveas/owl-audit-app:latest
    container_name: app-tomcat
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy # Espera que MariaDB responda antes de arrancar Tomcat
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=owl_auditv1
      - DB_USER=user
      - DB_PASSWORD=12345
    networks:
      - app-net

volumes:
  db_data:

networks:
  app-net:
    driver: bridge
